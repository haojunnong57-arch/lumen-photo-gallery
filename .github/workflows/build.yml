name: Build Lumen

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate icon
        run: |
          python3 -m pip install --quiet --user pillow numpy
          python3 scripts/make_icon.py

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -project Lumen.xcodeproj -scheme Lumen \
            -clonedSourcePackagesDirPath .build/spm \
            -resolvePackageDependencies

      - name: Build for simulator
        run: |
          xcodebuild -project Lumen.xcodeproj -scheme Lumen \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Lumen.xcodeproj Lumen/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate Xcode project [skip ci]"
            git push
          fi
